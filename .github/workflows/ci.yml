name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, "feat/**", "refactor/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify-bloom:
    name: BLOOM v6.0.0 Compile-Time Boundary Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - name: Checkout FLOW (v6.0.0)
        uses: actions/checkout@v4
        with:
          repository: hianova/FLOW
          ref: v6.0.0
          path: FLOW

      - name: Checkout BLOOM
        uses: actions/checkout@v4
        with:
          path: BLOOM

      - name: Install Toolchain & Vulkan Lavapipe + SDL3 GPU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang clang-tidy llvm lld curl cmake ninja-build pkg-config git \
            mesa-vulkan-drivers libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev
          git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_VULKAN=ON \
            -DSDL_OFFSCREEN=ON \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF
          sudo cmake --build /tmp/sdl3/build --target install
          sudo ldconfig
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0

      - name: Install W3C WebGPU Naga Compiler (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: naga-cli

      - name: Install Toolchain & SDL3 GPU (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm naga-cli sdl3 pkg-config
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0

      - name: Build FLOW & Compile BLOOM (Single-Track WGSL + SDL3 GPU Gate)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          if [ "$(uname -s)" = "Linux" ]; then
            export SDL_VIDEODRIVER=offscreen
            LVP_ICD="$(ls /usr/share/vulkan/icd.d/*lvp*.json | head -n 1)"
            export VK_ICD_FILENAMES="$LVP_ICD"
            export VK_DRIVER_FILES="$LVP_ICD"
          fi
          make -C FLOW all
          make -C BLOOM clean && make -C BLOOM verify
