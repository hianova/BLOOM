name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, "feat/**", "refactor/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  verify-bloom:
    name: BLOOM vNext C17 Core, Embedded Metal Shaders & Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build & Verify Portable C17 Core + Gate 1/2b (Linux)
        if: runner.os == 'Linux'
        run: |
          make clean
          make test-core CC=clang

      - name: Build Full Metal Targets & Verify Core + Gate 1/2b (macOS)
        if: runner.os == 'macOS'
        run: |
          make clean
          make all
          make test-core
